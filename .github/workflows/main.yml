name: Android ADB Access

on:
  workflow_dispatch:

jobs:
  android-adb:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Emulator & System Image
        run: |
          sdkmanager --install "emulator" "platform-tools" \
            "system-images;android-34;google_apis;x86_64"
          echo "no" | avdmanager create avd \
            --name "Pixel_API_34" \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_6"

      - name: Start Emulator
        run: |
          nohup $ANDROID_HOME/emulator/emulator \
            -avd Pixel_API_34 \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect &

          # انتظر حتى يبدأ الإمولايتر
          adb wait-for-device
          BOOTED=""
          RETRIES=0
          while [ "$BOOTED" != "1" ] && [ $RETRIES -lt 30 ]; do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            sleep 10
            RETRIES=$((RETRIES + 1))
          done
          echo "Emulator booted!"

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-android-${{ github.run_id }}

          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            sleep 5
            RETRIES=$((RETRIES + 1))
          done
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Enable ADB over TCP
        run: |
          adb tcpip 5555
          sleep 3
          echo "ADB_PORT=5555" >> $GITHUB_ENV

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== ANDROID ADB ACCESS ==="
          echo "Connect: adb connect $TAILSCALE_IP:5555"
          echo "Shell:   adb -s $TAILSCALE_IP:5555 shell"
          echo "=========================="
          echo ""
          while true; do
            echo "[$(date)] Android Emulator Active"
            adb devices
            sleep 300
          done
