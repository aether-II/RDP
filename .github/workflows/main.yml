name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators"       -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Disable Shutdown & Restart for RDP User
        shell: pwsh
        run: |
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          (Get-Content "$env:TEMP\secpol.cfg") `
            -replace "SeShutdownPrivilege.*", "" |
            Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db secedit.sdb `
            /cfg "$env:TEMP\secpol.cfg" /quiet
          Remove-Item "$env:TEMP\secpol.cfg" -Force
          Write-Host "Shutdown/Restart disabled for RDP user"

      - name: Install Microsoft Store
        timeout-minutes: 15
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'

          # تسجيل winget إن لم يكن جاهزًا
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
              Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe
          }

          # إعادة تسجيل المتجر
          $store = Get-AppxPackage -AllUsers Microsoft.WindowsStore
          if ($store) {
              $store | ForEach-Object {
                  Add-AppxPackage -DisableDevelopmentMode -Register "$($_.InstallLocation)\AppXManifest.xml"
              }
          } else {
              Write-Warning "Microsoft.WindowsStore package not found"
          }

          # تثبيت المتجر عبر winget مع الموافقات التلقائية
          winget install 9WZDNCRFJBMP --accept-package-agreements --accept-source-agreements --disable-interactivity
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:RUNNER_TEMP "tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tailscaleExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tailscaleExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: pwsh
        run: |
          $src       = "$env:GITHUB_WORKSPACE\Codebase"
          $downloads = "C:\Users\RDP\Downloads"

          if (-not (Test-Path $downloads)) {
              New-Item -ItemType Directory -Path $downloads -Force | Out-Null
          }

          if (Test-Path $src) {
              Copy-Item -Path "$src\*" -Destination $downloads -Recurse -Force
              Write-Host "Files copied to Downloads:"
              Get-ChildItem $downloads -Recurse | Select-Object FullName
          } else {
              Write-Warning "Codebase folder not found in repo"
          }

          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "Files at: C:\Users\RDP\Downloads"
          Write-Host "==================`n"

          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          while ($true) {
              try {
                  $uptime = (Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime

                  # فحص RDP service
                  $rdpService = Get-Service -Name TermService -ErrorAction Stop
                  if ($rdpService.Status -ne 'Running') {
                      Write-Warning "[$(Get-Date)] TermService stopped — restarting..."
                      Restart-Service -Name TermService -Force
                      Write-Host "[$(Get-Date)] TermService restarted successfully"
                  }

                  # فحص Tailscale
                  $tsService = Get-Service -Name Tailscale -ErrorAction SilentlyContinue
                  if ($tsService -and $tsService.Status -ne 'Running') {
                      Write-Warning "[$(Get-Date)] Tailscale stopped — restarting..."
                      Start-Service -Name Tailscale
                      Start-Sleep -Seconds 5
                      & $tailscaleExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}
                      Write-Host "[$(Get-Date)] Tailscale restarted successfully"
                  }

                  Write-Host "[$(Get-Date)] OK — Uptime: $([math]::Round($uptime.TotalMinutes, 1)) min"

              } catch {
                  Write-Error "[$(Get-Date)] ERROR: $($_.Exception.Message)"
                  Write-Error "Stack: $($_.ScriptStackTrace)"
              }

              Start-Sleep -Seconds 1800
          }
