name: MacOS

on:
  workflow_dispatch:

jobs:
  mac-vnc:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Create Atwy User
        run: |
          sudo pwpolicy -clearaccountpolicies || true

          PW="123"
          sudo dscl . -create /Users/atwy
          sudo dscl . -create /Users/atwy UserShell /bin/zsh
          sudo dscl . -create /Users/atwy RealName "Atwy"
          sudo dscl . -create /Users/atwy UniqueID 601
          sudo dscl . -create /Users/atwy PrimaryGroupID 20
          sudo dscl . -create /Users/atwy NFSHomeDirectory /Users/atwy

          if ! sudo dscl . -passwd /Users/atwy "$PW"; then
            echo "Password 123 rejected by macOS, using fallback"
            PW="Atwy1234"
            sudo dscl . -passwd /Users/atwy "$PW"
          fi

          sudo dscl . -append /Groups/admin GroupMembership atwy
          sudo createhomedir -c -u atwy || sudo mkdir -p /Users/atwy
          sudo chown -R atwy:staff /Users/atwy
          dscl . -read /Users/atwy UniqueID RealName
          echo "FINAL_PW=$PW" >> $GITHUB_ENV

      - name: Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$FINAL_PW" \
            -restart -agent -privs -all
          sleep 5
          nc -z localhost 5900 && echo "VNC is listening on 5900" || echo "VNC NOT listening"

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: atwy

      - name: Show Access Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "=== VNC ACCESS ==="
          echo "Address : atwy   (IP: $TS_IP)"
          echo "Port    : 5900"
          echo "Username: atwy"
          echo "Password: $FINAL_PW"
          echo "Console user: $(stat -f%Su /dev/console)"
          sw_vers
          echo "=================="

      - name: Maintain Connection
        run: |
          while true; do
            echo "[$(date)] OK"
            sleep 1800
          done
