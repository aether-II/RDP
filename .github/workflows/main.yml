name: AndroidDesktop

on:
  workflow_dispatch:

jobs:
  secure-android-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: bash
        run: |
          # تفعيل KVM
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "KVM غير متوفر على هذا الـ runner"; exit 1; }

          # تثبيت خفيف بدون الحزم الرسومية الزايدة
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils seabios ipxe-qemu \
            xrdp ssl-cert socat curl

          # إعداد xrdp: نخلي الملف الأصلي ونضيف قسم Android فقط
          sudo systemctl stop xrdp || true
          sudo cp /etc/xrdp/xrdp.ini /etc/xrdp/xrdp.ini.bak
          sudo sed -i '/^;\?autorun=/d' /etc/xrdp/xrdp.ini
          sudo sed -i '/^\[Globals\]/a autorun=Android' /etc/xrdp/xrdp.ini
          sudo tee -a /etc/xrdp/xrdp.ini > /dev/null << 'XRDP'

          [Android]
          name=Android
          lib=libvnc.so
          ip=127.0.0.1
          port=5901
          username=na
          password=ask
          XRDP

          # سكربت تشغيل الـ VM (يُستخدم هنا وفي إعادة التشغيل)
          cat > "$HOME/start_android.sh" << 'EMU'
          #!/usr/bin/env bash
          MON=/tmp/qemu-mon.sock
          rm -f "$MON"
          setsid nohup qemu-system-x86_64 \
            -enable-kvm -cpu host -m 6144 -smp 3 \
            -vga std -usb -device usb-tablet \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:5556-:5555 -device e1000,netdev=n0 \
            -cdrom "$HOME/android.iso" -boot d \
            -display none -vnc 127.0.0.1:1,password=on \
            -monitor unix:"$MON",server,nowait \
            -no-shutdown \
            >/tmp/qemu.log 2>&1 &
          sleep 3
          if ! pgrep -f qemu-system-x86_64 >/dev/null; then
            echo "QEMU NOT running"
            cat /tmp/qemu.log
            exit 1
          fi
          # باسورد VNC
          { echo "set_password vnc $VNC_PASS"; sleep 1; } | socat - UNIX-CONNECT:"$MON" > /dev/null
          # اختيار Live CD من قائمة الإقلاع
          sleep 20
          { echo "sendkey ret"; sleep 1; } | socat - UNIX-CONNECT:"$MON" > /dev/null
          sleep 60
          { echo "info status"; sleep 1; } | socat - UNIX-CONNECT:"$MON"
          echo "QEMU running"
          EMU
          chmod +x "$HOME/start_android.sh"

      - name: Create RDP Password
        shell: bash
        run: |
          password=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 8)
          if [ ${#password} -ne 8 ]; then
            echo "Password generation failed"
            exit 1
          fi
          echo "VNC_PASS=$password" >> $GITHUB_ENV

      - name: Download Android Desktop ISO
        timeout-minutes: 20
        shell: bash
        run: |
          curl -L --fail --retry 3 -o "$HOME/android.iso" \
            "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download" || true
          size=$(stat -c%s "$HOME/android.iso" 2>/dev/null || echo 0)
          if [ "$size" -lt 500000000 ]; then
            echo "Primary download failed (size=$size), trying mirror (32-bit)..."
            curl -L --fail --retry 3 -o "$HOME/android.iso" \
              "https://mirrors.xtom.com/osdn//android-x86/71931/android-x86-9.0-r2.iso"
            size=$(stat -c%s "$HOME/android.iso" 2>/dev/null || echo 0)
          fi
          echo "ISO size: $size"
          if [ "$size" -lt 500000000 ]; then
            echo "ISO download failed"
            exit 1
          fi

      - name: Start Android Desktop VM
        shell: bash
        run: |
          bash "$HOME/start_android.sh"

      - name: Install Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        shell: bash
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up --authkey="$TS_KEY" --hostname="gh-androiddesk-$GITHUB_RUN_ID"
          tsIP=""
          for i in $(seq 1 10); do
            tsIP=$(sudo tailscale ip -4 2>/dev/null | head -n1)
            [ -n "$tsIP" ] && break
            sleep 5
          done
          if [ -z "$tsIP" ]; then
            echo "Tailscale IP not assigned. Exiting."
            exit 1
          fi
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

          # VNC خام (للتشخيص) على عنوان Tailscale
          setsid nohup socat TCP-LISTEN:5902,bind="$tsIP",fork,reuseaddr TCP:127.0.0.1:5901 >/tmp/socat.log 2>&1 &

          if ! sudo systemctl restart xrdp; then
            echo "=== xrdp FAILED: journal ==="
            sudo journalctl -xeu xrdp --no-pager | tail -n 40
            echo "=== xrdp.log ==="
            sudo tail -n 40 /var/log/xrdp.log || true
            exit 1
          fi
          sleep 3
          sudo systemctl status xrdp --no-pager | head -n 12 || true

      - name: Verify RDP Accessibility
        shell: bash
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          if timeout 5 bash -c "</dev/tcp/$TAILSCALE_IP/3389"; then
            echo "TCP connectivity to RDP port 3389 successful!"
          else
            echo "TCP connection to RDP port 3389 failed"
            sudo tail -n 30 /var/log/xrdp.log || true
            exit 1
          fi
          if timeout 5 bash -c "</dev/tcp/127.0.0.1/5901"; then
            echo "QEMU VNC (5901) is up"
          else
            echo "QEMU VNC (5901) is NOT up"
            exit 1
          fi

      - name: Debug Screen
        continue-on-error: true
        shell: bash
        run: |
          { echo "screendump /tmp/screen.ppm"; sleep 2; } | socat - UNIX-CONNECT:/tmp/qemu-mon.sock > /dev/null
          python3 - << 'PY'
          d = open('/tmp/screen.ppm', 'rb').read()
          parts = d.split(b'\n', 3)
          w, h = map(int, parts[1].split())
          pix = parts[3]
          idx = range(0, len(pix) - 2, 150)
          nz = sum(1 for i in idx if pix[i] | pix[i + 1] | pix[i + 2])
          print(f"Screen resolution: {w}x{h}, non-black samples: {nz}/{len(idx)}")
          PY
          tail -n 20 /tmp/qemu.log || true
          sudo tail -n 20 /var/log/xrdp.log || true

      - name: Maintain Connection
        shell: bash
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # نسخ ملفات Codebase (يحتاج ADB داخل Android، محاولة فقط)
          src="$GITHUB_WORKSPACE/Codebase"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          if [ -d "$src" ]; then
            adb connect 127.0.0.1:5556 || true
            adb -s 127.0.0.1:5556 push "$src/." /sdcard/Download/ || echo "WARNING: ADB push failed (adb inside Android may be disabled)"
            for apk in $(find "$src" -name '*.apk'); do
              adb -s 127.0.0.1:5556 install -r "$apk" || true
            done
          else
            echo "WARNING: Codebase folder not found in repo"
          fi

          echo ""
          echo "=== ANDROID DESKTOP RDP ACCESS ==="
          echo "Address : $TAILSCALE_IP"
          echo "Username: na  (أي اسم)"
          echo "Password: $VNC_PASS"
          echo "Raw VNC (debug): $TAILSCALE_IP:5902  (RealVNC, same password)"
          echo "=================================="
          echo ""

          while true; do
            # فحص الـ VM
            if ! pgrep -f qemu-system-x86_64 >/dev/null; then
              echo "[$(date)] WARNING: QEMU stopped — restarting..."
              bash "$HOME/start_android.sh" && echo "[$(date)] QEMU restarted successfully"
            fi

            # فحص xrdp
            if ! systemctl is-active --quiet xrdp; then
              echo "[$(date)] WARNING: xrdp stopped — restarting..."
              sudo systemctl restart xrdp
            fi

            # فحص Tailscale
            if ! sudo tailscale status >/dev/null 2>&1; then
              echo "[$(date)] WARNING: Tailscale stopped — restarting..."
              sudo systemctl restart tailscaled || true
              sleep 5
              sudo tailscale up --authkey="$TS_KEY" || true
            fi

            echo "[$(date)] OK"
            sleep 1800
          done
