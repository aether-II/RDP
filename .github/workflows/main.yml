name: Android VNC Access

on:
  workflow_dispatch:

jobs:
  android-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Emulator & System Image
        run: |
          sdkmanager --install "emulator" "platform-tools" \
            "system-images;android-34;google_apis;x86_64"
          echo "no" | avdmanager create avd \
            --name "Pixel_API_34" \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_6"

      - name: Start Emulator
        run: |
          nohup $ANDROID_HOME/emulator/emulator \
            -avd Pixel_API_34 \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect &

          adb wait-for-device
          BOOTED=""
          RETRIES=0
          while [ "$BOOTED" != "1" ] && [ $RETRIES -lt 30 ]; do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            sleep 10
            RETRIES=$((RETRIES + 1))
          done
          echo "Emulator booted!"

      - name: Install & Start VNC Server
        run: |
          brew install tiger-vnc

          VNC_PASS=$(openssl rand -base64 8 | tr -dc 'A-Za-z0-9' | head -c 8)
          echo "$VNC_PASS" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          echo "VNC_PASS=$VNC_PASS" >> $GITHUB_ENV

          # شغّل virtual display
          Xvfb :1 -screen 0 1280x800x24 &
          export DISPLAY=:1

          # شغّل VNC على الـ display
          x0vncserver -display :1 -passwordfile ~/.vnc/passwd -rfbport 5900 &
          sleep 3

          # شغّل الإمولايتر على نفس الـ display
          DISPLAY=:1 nohup $ANDROID_HOME/emulator/emulator \
            -avd Pixel_API_34 \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect &

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-vnc-${{ github.run_id }}

          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            sleep 5
            RETRIES=$((RETRIES + 1))
          done
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== VNC ACCESS ==="
          echo "Host:     $TAILSCALE_IP"
          echo "Port:     5900"
          echo "Password: $VNC_PASS"
          echo "=================="
          echo ""
          while true; do
            echo "[$(date)] VNC Active"
            sleep 300
          done
