name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 58

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "RDP" -Password $securePass
          } else {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "RDP"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          }

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          if (Get-Command tailscale -ErrorAction SilentlyContinue) {
              Write-Host "Tailscale already installed, skipping."
              exit 0
          }
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:RUNNER_TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          & $tailscaleExe up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-rdp-runner --reset

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              Start-Sleep -Seconds 5
              $tsIP = (& $tailscaleExe ip -4 2>$null)
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_WORKFLOW: ${{ github.workflow }}
        run: |
          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "==================`n"

          $deadline = (Get-Date).AddMinutes(50)

          while ($true) {
              # ======================================================
              # تحقق من الوقت — لو اقتربنا من الـ deadline أعد تشغيل الـ workflow
              # ======================================================
              if ((Get-Date) -ge $deadline) {
                  Write-Host "[$(Get-Date)] 🔁 Approaching time limit — triggering new workflow run..."
                  $headers = @{
                      Authorization = "Bearer $env:GH_TOKEN"
                      Accept        = "application/vnd.github+json"
                      "X-GitHub-Api-Version" = "2022-11-28"
                  }
                  $body = (@{ ref = "main" } | ConvertTo-Json)
                  $uri  = "https://api.github.com/repos/$env:GH_REPO/actions/workflows/$env:GH_WORKFLOW/dispatches"
                  try {
                      Invoke-RestMethod -Uri $uri -Method POST -Headers $headers -Body $body -ContentType "application/json"
                      Write-Host "[$(Get-Date)] ✅ New workflow triggered successfully."
                  } catch {
                      Write-Host "[$(Get-Date)] ❌ Failed to trigger workflow: $_"
                  }
                  Start-Sleep -Seconds 120
                  exit 0
              }

              # ======================================================
              # تحقق من حالة Tailscale وأعد الاتصال إن كان offline
              # ======================================================
              try {
                  $status   = & $tailscaleExe status --json 2>$null | ConvertFrom-Json
                  $isOnline = $status.BackendState -eq "Running"
              } catch {
                  $isOnline = $false
              }

              if (-not $isOnline) {
                  Write-Host "[$(Get-Date)] ⚠️  Tailscale offline — attempting reconnect..."

                  $netReady   = $false
                  $netRetries = 0
                  while (-not $netReady -and $netRetries -lt 24) {
                      try {
                          if (Test-Connection -ComputerName "8.8.8.8" -Count 1 -Quiet) {
                              $netReady = $true
                          }
                      } catch {}
                      if (-not $netReady) {
                          Write-Host "[$(Get-Date)] 🔄 Waiting for network... ($netRetries/24)"
                          Start-Sleep -Seconds 10
                          $netRetries++
                      }
                  }

                  if ($netReady) {
                      & $tailscaleExe up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-rdp-runner
                      Write-Host "[$(Get-Date)] ✅ Tailscale reconnected."
                  } else {
                      Write-Host "[$(Get-Date)] ❌ Network unavailable after waiting."
                  }
              } else {
                  Write-Host "[$(Get-Date)] ✅ RDP Active — Tailscale online"
              }

              Start-Sleep -Seconds 30
          }
