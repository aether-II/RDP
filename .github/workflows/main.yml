name: Android10

on:
  workflow_dispatch:

jobs:
  secure-android:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core Android Settings
        shell: bash
        run: |
          # تفعيل KVM
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "KVM غير متوفر على هذا الـ runner"; exit 1; }

          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc fluxbox socat \
            libpulse0 libxcb-cursor0 libxkbfile1 libgl1 libnss3 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 \
            libxcb-xinput0 libx11-xcb1 libxcb-glx0

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools"          >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator"                >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-29;google_apis_playstore;x86_64"
          echo no | avdmanager create avd -n android10 \
            -k "system-images;android-29;google_apis_playstore;x86_64" \
            -d pixel_2 --force

          # سكربت تشغيل المحاكي (يُستخدم هنا وفي إعادة التشغيل)
          cat > "$HOME/start_android.sh" << 'EMU'
          #!/usr/bin/env bash
          export DISPLAY=:0
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          pgrep -x Xvfb >/dev/null || { setsid nohup Xvfb :0 -screen 0 1080x1920x24 >/tmp/xvfb.log 2>&1 & sleep 2; }
          pgrep -x fluxbox >/dev/null || { setsid nohup fluxbox >/tmp/fluxbox.log 2>&1 & sleep 1; }
          setsid nohup emulator -avd android10 -accel on -gpu swiftshader_indirect \
            -no-snapshot -no-audio -no-boot-anim -memory 4096 -cores 3 \
            >/tmp/emulator.log 2>&1 &
          sleep 30
          echo "--- emulator log ---"
          tail -n 40 /tmp/emulator.log
          if ! pgrep -f qemu-system >/dev/null; then
            echo "emulator NOT running"
            exit 1
          fi
          echo "emulator running"
          adb start-server
          timeout 300 adb wait-for-device || { echo "adb wait timeout"; tail -n 80 /tmp/emulator.log; exit 1; }
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "Android booted"
              exit 0
            fi
            sleep 5
          done
          echo "Emulator boot timeout"
          tail -n 60 /tmp/emulator.log
          exit 1
          EMU
          chmod +x "$HOME/start_android.sh"
          bash "$HOME/start_android.sh"
          adb shell getprop ro.build.version.release

      - name: Create VNC Password
        shell: bash
        run: |
          password=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 8)
          if [ ${#password} -ne 8 ]; then
            echo "Password generation failed"
            exit 1
          fi
          echo "VNC_PASS=$password" >> $GITHUB_ENV

      - name: Keep Android Awake (No Sleep)
        shell: bash
        run: |
          adb shell svc power stayon true
          adb shell settings put global stay_on_while_plugged_in 7
          adb shell settings put system screen_off_timeout 2147483647
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell input keyevent 82
          echo "Android sleep disabled"

      - name: Install Google Play Store
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: |
          # صورة google_apis_playstore فيها المتجر جاهز
          adb shell pm list packages > /tmp/pkgs.txt
          if grep -q "com.android.vending" /tmp/pkgs.txt; then
            echo "Play Store is installed"
          else
            echo "Play Store package not found"
            exit 1
          fi

      - name: Install Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        shell: bash
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up --authkey="$TS_KEY" --hostname="gh-android-$GITHUB_RUN_ID"
          tsIP=""
          for i in $(seq 1 10); do
            tsIP=$(sudo tailscale ip -4 2>/dev/null | head -n1)
            [ -n "$tsIP" ] && break
            sleep 5
          done
          if [ -z "$tsIP" ]; then
            echo "Tailscale IP not assigned. Exiting."
            exit 1
          fi
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

          # VNC على عنوان Tailscale فقط
          mkdir -p ~/.vnc
          x11vnc -storepasswd "$VNC_PASS" ~/.vnc/passwd
          DISPLAY=:0 x11vnc -display :0 -rfbauth ~/.vnc/passwd \
            -listen "$tsIP" -rfbport 5900 -forever -shared -bg -o /tmp/x11vnc.log

          # ADB (للـ scrcpy من الكمبيوتر)
          setsid nohup socat TCP-LISTEN:5555,bind="$tsIP",fork,reuseaddr TCP:127.0.0.1:5555 >/tmp/socat.log 2>&1 &
          sleep 2

      - name: Verify Android Accessibility
        shell: bash
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          for port in 5900 5555; do
            if timeout 5 bash -c "</dev/tcp/$TAILSCALE_IP/$port"; then
              echo "TCP connectivity to port $port successful!"
            else
              echo "TCP connection to port $port failed"
              exit 1
            fi
          done
          adb devices

      - name: Maintain Connection
        shell: bash
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          src="$GITHUB_WORKSPACE/Codebase"
          downloads="/sdcard/Download"

          if [ -d "$src" ]; then
            adb push "$src/." "$downloads/"
            echo "Files copied to Downloads:"
            adb shell ls -R "$downloads"
            for apk in $(find "$src" -name '*.apk'); do
              echo "Installing $apk"
              adb install -r "$apk" || true
            done
          else
            echo "WARNING: Codebase folder not found in repo"
          fi

          echo ""
          echo "=== ANDROID 10 ACCESS ==="
          echo "VNC     : $TAILSCALE_IP:5900"
          echo "Password: $VNC_PASS"
          echo "ADB     : adb connect $TAILSCALE_IP:5555  ثم  scrcpy -s $TAILSCALE_IP:5555"
          echo "Files at: /sdcard/Download"
          echo "=========================="
          echo ""

          while true; do
            # فحص المحاكي
            if ! pgrep -f "qemu-system" >/dev/null; then
              echo "[$(date)] WARNING: Emulator stopped — restarting..."
              bash "$HOME/start_android.sh" && echo "[$(date)] Emulator restarted successfully"
            fi

            # فحص VNC
            if ! pgrep -x x11vnc >/dev/null; then
              echo "[$(date)] WARNING: VNC stopped — restarting..."
              DISPLAY=:0 x11vnc -display :0 -rfbauth ~/.vnc/passwd \
                -listen "$TAILSCALE_IP" -rfbport 5900 -forever -shared -bg -o /tmp/x11vnc.log
            fi

            # فحص ADB forward
            if ! pgrep -x socat >/dev/null; then
              echo "[$(date)] WARNING: ADB forward stopped — restarting..."
              setsid nohup socat TCP-LISTEN:5555,bind="$TAILSCALE_IP",fork,reuseaddr TCP:127.0.0.1:5555 >/tmp/socat.log 2>&1 &
            fi

            # فحص Tailscale
            if ! sudo tailscale status >/dev/null 2>&1; then
              echo "[$(date)] WARNING: Tailscale stopped — restarting..."
              sudo systemctl restart tailscaled || true
              sleep 5
              sudo tailscale up --authkey="$TS_KEY" || true
            fi

            echo "[$(date)] OK — Android state: $(adb get-state 2>&1 | tr -d '\r')"
            sleep 1800
          done
