
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025-vs2026
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
                           -Name "LimitBlankPasswordUse" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create Atwy User (No Password)
        shell: pwsh
        run: |
          # السماح بباسورد فارغ وبدون انتهاء صلاحية
          net accounts /minpwlen:0 /maxpwage:unlimited /minpwage:0
          New-LocalUser -Name "Atwy" -NoPassword -AccountNeverExpires
          Set-LocalUser -Name "Atwy" -PasswordNeverExpires $true -UserMayChangePassword $false
          net user Atwy /passwordreq:no
          net user Atwy /logonpasswordchg:no
          Add-LocalGroupMember -Group "Administrators"       -Member "Atwy"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Atwy"
          if (-not (Get-LocalUser -Name "Atwy" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }
          net user Atwy
          Write-Host "User Atwy created without password"

      - name: Disable Shutdown & Restart for Atwy
        shell: pwsh
        run: |
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          (Get-Content "$env:TEMP\secpol.cfg") `
            -replace "SeShutdownPrivilege.*", "" |
            Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db secedit.sdb `
            /cfg "$env:TEMP\secpol.cfg" /quiet
          Remove-Item "$env:TEMP\secpol.cfg" -Force
          Write-Host "Shutdown/Restart disabled"

      - name: Dark Theme + Wallpaper (Fit)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'

          $wpUrl  = "https://i.imgur.com/E3vPXT9.png"
          $wpPath = "C:\Windows\Web\Wallpaper\atwy.png"

          Invoke-WebRequest -Uri $wpUrl -OutFile $wpPath -UserAgent "Mozilla/5.0"

          # تحقق أن الملف PNG فعلاً وليس صفحة حجب
          $bytes = [System.IO.File]::ReadAllBytes($wpPath)
          if ($bytes.Length -lt 1000 -or $bytes[0] -ne 0x89 -or $bytes[1] -ne 0x50 -or $bytes[2] -ne 0x4E -or $bytes[3] -ne 0x47) {
              Write-Error "Downloaded file is not a valid PNG (size: $($bytes.Length) bytes)"
              exit 1
          }
          Write-Host "Wallpaper downloaded OK ($($bytes.Length) bytes)"

          reg load HKU\DefaultUser "C:\Users\Default\NTUSER.DAT" | Out-Null
          try {
              $personalize = "Registry::HKEY_USERS\DefaultUser\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
              New-Item -Path $personalize -Force | Out-Null
              Set-ItemProperty -Path $personalize -Name "AppsUseLightTheme"    -Type DWord -Value 0
              Set-ItemProperty -Path $personalize -Name "SystemUsesLightTheme" -Type DWord -Value 0

              $desktop = "Registry::HKEY_USERS\DefaultUser\Control Panel\Desktop"
              New-Item -Path $desktop -Force | Out-Null
              Set-ItemProperty -Path $desktop -Name "Wallpaper"      -Type String -Value $wpPath
              Set-ItemProperty -Path $desktop -Name "WallpaperStyle" -Type String -Value "6"
              Set-ItemProperty -Path $desktop -Name "TileWallpaper"  -Type String -Value "0"
          } finally {
              [gc]::Collect()
              Start-Sleep -Seconds 2
              reg unload HKU\DefaultUser | Out-Null
          }
          Write-Host "Dark theme + wallpaper (Fit) configured"

      - name: Install Microsoft Store
        timeout-minutes: 15
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'

          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
              Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe
          }

          $store = Get-AppxPackage -AllUsers Microsoft.WindowsStore
          if ($store) {
              $store | ForEach-Object {
                  Add-AppxPackage -DisableDevelopmentMode -Register "$($_.InstallLocation)\AppXManifest.xml"
              }
          } else {
              Write-Warning "Microsoft.WindowsStore package not found"
          }

          winget install 9WZDNCRFJBMP --accept-package-agreements --accept-source-agreements --disable-interactivity
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:RUNNER_TEMP "tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tailscaleExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=atwy
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tailscaleExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: pwsh
        run: |
          $src       = "$env:GITHUB_WORKSPACE\Codebase"
          $downloads = "C:\Users\Atwy\Downloads"

          if (-not (Test-Path $downloads)) {
              New-Item -ItemType Directory -Path $downloads -Force | Out-Null
          }

          if (Test-Path $src) {
              Copy-Item -Path "$src\*" -Destination $downloads -Recurse -Force
              Write-Host "Files copied to Downloads:"
              Get-ChildItem $downloads -Recurse | Select-Object FullName
          } else {
              Write-Warning "Codebase folder not found in repo"
          }

          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address : $env:TAILSCALE_IP  (or: atwy)"
          Write-Host "Username: Atwy"
          Write-Host "Password: (none - leave empty)"
          Write-Host "Files at: C:\Users\Atwy\Downloads"
          Write-Host "==================`n"

          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          while ($true) {
              try {
                  $uptime = (Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime

                  $rdpService = Get-Service -Name TermService -ErrorAction Stop
                  if ($rdpService.Status -ne 'Running') {
                      Write-Warning "[$(Get-Date)] TermService stopped — restarting..."
                      Restart-Service -Name TermService -Force
                      Write-Host "[$(Get-Date)] TermService restarted successfully"
                  }

                  $tsService = Get-Service -Name Tailscale -ErrorAction SilentlyContinue
                  if ($tsService -and $tsService.Status -ne 'Running') {
                      Write-Warning "[$(Get-Date)] Tailscale stopped — restarting..."
                      Start-Service -Name Tailscale
                      Start-Sleep -Seconds 5
                      & $tailscaleExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=atwy
                      Write-Host "[$(Get-Date)] Tailscale restarted successfully"
                  }

                  Write-Host "[$(Get-Date)] OK — Uptime: $([math]::Round($uptime.TotalMinutes, 1)) min"

              } catch {
                  Write-Error "[$(Get-Date)] ERROR: $($_.Exception.Message)"
                  Write-Error "Stack: $($_.ScriptStackTrace)"
              }

              Start-Sleep -Seconds 1800
          }
