name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:RUNNER_TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Configure Tailscale Auto-Reconnect on Restart
        shell: pwsh
        run: |
          # ======================================================
          # إنشاء سكريبت يعيد تشغيل Tailscale تلقائياً بعد أي restart
          # ======================================================
          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          $authKey     = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          $hostname    = "gh-runner-$env:GITHUB_RUN_ID"

          $scriptContent = @"
          `$tailscaleExe = '$tailscaleExe'
          `$maxWait = 120   # ثواني الانتظار حتى يجهز النظام بعد الـ restart
          `$waited  = 0

          # انتظر حتى يصبح الـ service متاحاً
          while (`$waited -lt `$maxWait) {
              try {
                  `$svc = Get-Service -Name Tailscale -ErrorAction Stop
                  if (`$svc.Status -eq 'Running') { break }
              } catch {}
              Start-Sleep -Seconds 5
              `$waited += 5
          }

          # أعد الاتصال بنفس الـ authkey والـ hostname
          & `$tailscaleExe up --authkey=$authKey --hostname=$hostname
"@

          $scriptPath = "C:\TailscaleReconnect.ps1"
          Set-Content -Path $scriptPath -Value $scriptContent -Encoding UTF8

          # سجّل المهمة في Task Scheduler لتعمل عند بدء تشغيل النظام
          $action  = New-ScheduledTaskAction -Execute "powershell.exe" `
                       -Argument "-ExecutionPolicy Bypass -NonInteractive -File `"$scriptPath`""
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Hours 1)

          Register-ScheduledTask -TaskName "TailscaleAutoReconnect" `
                                 -Action $action `
                                 -Trigger $trigger `
                                 -Principal $principal `
                                 -Settings $settings `
                                 -Force
          Write-Host "✅ Tailscale auto-reconnect task registered."

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          & $tailscaleExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tailscaleExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: pwsh
        run: |
          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_CREDS"
          Write-Host "==================`n"

          while ($true) {
              # ======================================================
              # تحقق من حالة Tailscale وأعد الاتصال إن كان offline
              # ======================================================
              try {
                  $status = & $tailscaleExe status --json 2>$null | ConvertFrom-Json
                  $isOnline = $status.BackendState -eq "Running"
              } catch {
                  $isOnline = $false
              }

              if (-not $isOnline) {
                  Write-Host "[$(Get-Date)] ⚠️  Tailscale offline — attempting reconnect..."

                  # انتظر حتى يكتمل أي restart جارٍ (تحقق من اتصال الشبكة أولاً)
                  $netReady = $false
                  $netRetries = 0
                  while (-not $netReady -and $netRetries -lt 24) {
                      try {
                          $ping = Test-Connection -ComputerName "8.8.8.8" -Count 1 -Quiet
                          if ($ping) { $netReady = $true }
                      } catch {}
                      if (-not $netReady) {
                          Write-Host "[$(Get-Date)] 🔄 Waiting for network... ($netRetries/24)"
                          Start-Sleep -Seconds 10
                          $netRetries++
                      }
                  }

                  if ($netReady) {
                      & $tailscaleExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
                                         --hostname=gh-runner-$env:GITHUB_RUN_ID
                      Write-Host "[$(Get-Date)] ✅ Tailscale reconnected."
                  } else {
                      Write-Host "[$(Get-Date)] ❌ Network unavailable after waiting. Will retry next cycle."
                  }
              } else {
                  Write-Host "[$(Get-Date)] ✅ RDP Active — Tailscale online"
              }

              Start-Sleep -Seconds 30
          }
